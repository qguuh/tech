# Endereço do banco de dados

spring.datasource.url="jdbc:mysql://localhost:3306/techos"
#Usuário do banco
spring.datasource.username=root
#senha do banco de dados
spring.datasource.password=

#Update: o spring JPA irá utilizar o banco de dados automaticamente com base nas entidades definidas
spring.jpa.hibernate.ddl-auto=update

#mostra o terminal SQL gerado pelo hibernate
spring.jpa.show-sql=true

